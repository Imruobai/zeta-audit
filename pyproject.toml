[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeta-audit"
version = "0.4.1"
description = "Audit a Riemann zeta zero table: structure, residuals, independent cross-check, and a windowed count that detects a missing zero."
readme = "docs/PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Imruobai" }]
keywords = [
    "riemann-zeta",
    "zeta-zeros",
    "zero-table",
    "odlyzko",
    "lmfdb",
    "number-theory",
    "verification",
    "mpmath",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/Imruobai/zeta-audit"
Repository = "https://github.com/Imruobai/zeta-audit"
Issues = "https://github.com/Imruobai/zeta-audit/issues"
Changelog = "https://github.com/Imruobai/zeta-audit/blob/main/docs/RELEASE_NOTES.md"

[project.optional-dependencies]
# mpmath is OPTIONAL and used only for the independent cross-check and the windowed
# completeness count. Without it those checks report "skipped" instead of pretending
# to have run.
crosscheck = ["mpmath>=1.3"]
dev = ["mpmath>=1.3", "pytest>=7"]

[project.scripts]
zeta-audit = "zeta_audit.audit_table:main"
zeta-audit-cli = "zeta_audit.cli:main"

[tool.setuptools]
packages = ["zeta_audit"]

[tool.setuptools.package-data]
zeta_audit = ["py.typed"]