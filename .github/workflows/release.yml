name: release

# Publish to PyPI on a version tag, using PyPI Trusted Publishing (no token stored).
# Setup once on PyPI: Project -> Publishing -> add a GitHub publisher with
#   owner: <your-user>, repo: zeta-audit, workflow: release.yml, environment: pypi
# Then:  git tag v0.4.0 && git push origin v0.4.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: smoke-test the wheel before publishing
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install "dist/"*.whl "mpmath>=1.3"
          /tmp/v/bin/zeta-audit data/odlyzko_zeros1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1